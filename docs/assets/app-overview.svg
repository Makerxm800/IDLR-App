<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5b56"/>
      <stop offset="1" stop-color="#d9133b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2020"/>
      <stop offset="1" stop-color="#cc0000"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="630" fill="#050505"/>
  <ellipse cx="980" cy="40" rx="420" ry="200" fill="#ff2020" opacity="0.06"/>

  <!-- window frame -->
  <rect x="60" y="46" width="1080" height="538" rx="22" fill="#0b0b0d" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="92" cy="74" r="5" fill="#3a3a3f"/>
  <circle cx="110" cy="74" r="5" fill="#3a3a3f"/>
  <circle cx="128" cy="74" r="5" fill="#3a3a3f"/>

  <!-- sidebar -->
  <rect x="60" y="46" width="228" height="538" rx="22" fill="#08080a"/>
  <rect x="287" y="46" width="1" height="538" fill="#ffffff" opacity="0.06"/>

  <!-- brand -->
  <rect x="86" y="96" width="38" height="38" rx="11" fill="url(#mark)"/>
  <path d="M105 106v14m0 0 6-6m-6 6-6-6M96 126h18" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="136" y="113" fill="#f2f2f4" font-size="16" font-weight="800">IDLR</text>
  <text x="136" y="127" fill="#7d7d85" font-size="9.5" letter-spacing="0.4">INTERNET DOWNLOADER</text>

  <!-- active tab: Download (accent bar + red tint) -->
  <rect x="78" y="158" width="196" height="40" rx="10" fill="#ff2020" opacity="0.10"/>
  <rect x="81" y="169" width="3" height="18" rx="1.5" fill="url(#bar)"/>
  <path d="M104 170v8m0 0 3.4-3.4M104 178l-3.4-3.4M98 182h12" stroke="#ff4b4b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="183" fill="#ff4b4b" font-size="12.5" font-weight="700">Download</text>

  <!-- inactive tab: History (white hover wash) -->
  <rect x="78" y="202" width="196" height="40" rx="10" fill="#ffffff" opacity="0.075" stroke="#ffffff" stroke-opacity="0.07"/>
  <circle cx="104" cy="222" r="7" fill="none" stroke="#9a9aa2" stroke-width="2"/>
  <path d="M104 218v4l3 2" stroke="#9a9aa2" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="120" y="227" fill="#c9c9cf" font-size="12.5">History</text>

  <!-- divider -->
  <rect x="78" y="430" width="196" height="1" fill="#ffffff" opacity="0.06"/>

  <!-- rail action rows -->
  <g font-size="12" fill="#9a9aa2">
    <rect x="78" y="444" width="196" height="38" rx="10" fill="#ffffff" opacity="0.065" stroke="#ffffff" stroke-opacity="0.08"/>
    <path d="M104 455a5.4 5.4 0 0 1 10.8 0c0 4.6 2 5.8 2 5.8H92.8s2-1.2 2-5.8A5.4 5.4 0 0 1 104 455zm-1.8 9.6a1.9 1.9 0 0 0 3.6 0" transform="translate(-5 0)" fill="none" stroke="#e8e8ec" stroke-width="1.8" stroke-linecap="round"/>
    <text x="118" y="468" fill="#e8e8ec">Notifications</text>
    <rect x="242" y="455" width="18" height="18" rx="9" fill="#ff2020"/>
    <text x="251" y="468" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">3</text>

    <circle cx="99" cy="501" r="7.4" fill="none" stroke="#9a9aa2" stroke-width="1.8"/>
    <text x="99" y="504.5" fill="#9a9aa2" font-size="9" font-weight="700" text-anchor="middle">i</text>
    <text x="118" y="506">Info &amp; help</text>

    <circle cx="99" cy="539" r="6.6" fill="none" stroke="#9a9aa2" stroke-width="1.8"/>
    <circle cx="99" cy="539" r="2.2" fill="none" stroke="#9a9aa2" stroke-width="1.8"/>
    <text x="118" y="544">Settings</text>
  </g>

  <!-- main area: hero -->
  <text x="330" y="140" font-size="46" font-weight="800">
    <tspan fill="#f2f2f4">Download </tspan><tspan fill="#ff2020">Anything.</tspan>
  </text>
  <text x="330" y="192" font-size="46" font-weight="800">
    <tspan fill="#f2f2f4">Zero </tspan><tspan fill="#ff2020">Limits.</tspan>
  </text>

  <!-- url bar -->
  <rect x="330" y="228" width="620" height="54" rx="14" fill="#121214" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="358" cy="255" r="9" fill="none" stroke="#7d7d85" stroke-width="2"/>
  <path d="M358 251v8m0 0-3-3m3 3 3-3" stroke="#7d7d85" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="378" y="259" fill="#63636b" font-size="13.5">https://youtube.com/… or spotify:track:…</text>

  <!-- option pills -->
  <g font-size="11.5" font-weight="600">
    <rect x="330" y="298" width="128" height="34" rx="10" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="346" y="320" fill="#c9c9cf">Mode · Video</text>
    <rect x="468" y="298" width="148" height="34" rx="10" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="484" y="320" fill="#c9c9cf">Quality · 1080p</text>
    <rect x="626" y="298" width="128" height="34" rx="10" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="642" y="320" fill="#c9c9cf">Format · MP4</text>
    <rect x="792" y="296" width="158" height="38" rx="12" fill="url(#bar)"/>
    <text x="871" y="321" fill="#ffffff" text-anchor="middle">Download Now</text>
  </g>

  <!-- progress card -->
  <rect x="330" y="368" width="620" height="120" rx="18" fill="#121214" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="354" y="392" width="56" height="56" rx="12" fill="url(#mark)"/>
  <path d="M382 404v22m0 0 8-8m-8 8-8-8M370 436h24" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="428" y="412" fill="#f2f2f4" font-size="13.5" font-weight="700">Downloading — Movie Trailer (1080p).mp4</text>
  <text x="428" y="432" fill="#9a9aa2" font-size="11">62% · 8.4 MB/s · 12 s left</text>
  <rect x="428" y="448" width="498" height="8" rx="4" fill="#ffffff" opacity="0.07"/>
  <rect x="428" y="448" width="309" height="8" rx="4" fill="url(#bar)"/>

  <!-- caption -->
  <text x="600" y="614" fill="#63636b" font-size="12" text-anchor="middle">The desktop app — sidebar navigation, live progress, everything on your PC.</text>
</svg>
