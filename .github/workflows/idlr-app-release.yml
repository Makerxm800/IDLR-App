name: Build IDLR App releases

on:
  workflow_dispatch:
    inputs:
      publish_from_run_id:
        description: Optional successful build run ID to publish without rebuilding
        required: false
        type: string
      release_tag:
        description: Release tag to publish when reusing build artifacts
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  # Windows and Linux share one job because they cost the same free minutes and
  # neither can be skipped: `IDLR-App-Setup.exe` and the AppImage are what the
  # updater manifest requires unconditionally (see scripts/create_updater_manifest.py).
  build-desktop:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_from_run_id == ''
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Tauri CLI
        run: npm ci

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev pkg-config libcairo2-dev \
            libgirepository-2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Install Linux desktop bindings
        if: runner.os == 'Linux'
        run: python -m pip install PyGObject

      # Same switch as .github/workflows/tests.yml: the suite must not race a
      # best-effort FFmpeg download that `import app` would otherwise start.
      - name: Run test suite
        env:
          IDLR_NO_AUTO_INSTALL: "1"
        run: python -m unittest discover -s tests

      - name: Build desktop app
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY GitHub Actions secret before building signed app updates."
            exit 1
          fi
          python build.py

      # FFmpeg must reach the bundle as a file beside the helpers, not as a copy
      # sealed inside each onefile exe: that is what makes the install smaller and
      # stops every launch re-extracting ~80 MB into %TEMP%. Checked here rather
      # than trusted, because a resource mapping that silently matched nothing
      # would still produce a green build.
      - name: Verify the shared FFmpeg was bundled
        shell: bash
        run: |
          if [ -f dist/ffmpeg/FFmpeg-not-staged.txt ]; then
            echo "::warning::This build staged no FFmpeg (none was available at build time); IDLR will use a system FFmpeg."
            exit 0
          fi
          found="$(find src-tauri/target -type f \( -name ffmpeg -o -name ffmpeg.exe \) -print -quit 2>/dev/null || true)"
          if [ -z "$found" ]; then
            echo "::error::dist/ffmpeg was staged but no ffmpeg reached the bundle — check bundle.resources in src-tauri/tauri.conf.json."
            exit 1
          fi
          echo "Bundled shared FFmpeg: $found"

      - name: Record updater platform
        shell: bash
        run: printf '%s\n' '${{ runner.arch }}' > "src-tauri/target/release/bundle/target-${{ runner.os }}.txt"

      - name: Upload native app bundles
        uses: actions/upload-artifact@v7
        with:
          name: IDLR-App-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/target-*.txt
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  # macOS is its own job on purpose. Its runners cost 10x the included minutes,
  # so the leg can end up `cancelled` with no runner ever assigned — which is
  # what happened to the v2.0.5 attempt, where it read as "macos was cancelled"
  # and took the whole release with it. A macOS runner being *unavailable* must
  # not hold the Windows and Linux installers hostage; a macOS build that is
  # genuinely *broken* still blocks the publish below.
  build-macos:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_from_run_id == ''
    name: Build (macOS)
    runs-on: macos-14
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Tauri CLI
        run: npm ci

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run test suite
        env:
          IDLR_NO_AUTO_INSTALL: "1"
        run: python -m unittest discover -s tests

      - name: Build desktop app
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY GitHub Actions secret before building signed app updates."
            exit 1
          fi
          python build.py

      # FFmpeg must reach the bundle as a file beside the helpers, not as a copy
      # sealed inside each onefile exe: that is what makes the install smaller and
      # stops every launch re-extracting ~80 MB into %TEMP%. Checked here rather
      # than trusted, because a resource mapping that silently matched nothing
      # would still produce a green build.
      - name: Verify the shared FFmpeg was bundled
        shell: bash
        run: |
          if [ -f dist/ffmpeg/FFmpeg-not-staged.txt ]; then
            echo "::warning::This build staged no FFmpeg (none was available at build time); IDLR will use a system FFmpeg."
            exit 0
          fi
          found="$(find src-tauri/target -type f \( -name ffmpeg -o -name ffmpeg.exe \) -print -quit 2>/dev/null || true)"
          if [ -z "$found" ]; then
            echo "::error::dist/ffmpeg was staged but no ffmpeg reached the bundle — check bundle.resources in src-tauri/tauri.conf.json."
            exit 1
          fi
          echo "Bundled shared FFmpeg: $found"

      - name: Record updater platform
        shell: bash
        run: printf '%s\n' '${{ runner.arch }}' > "src-tauri/target/release/bundle/target-${{ runner.os }}.txt"

      - name: Upload native app bundles
        uses: actions/upload-artifact@v7
        with:
          name: IDLR-App-macOS
          path: |
            src-tauri/target/release/bundle/target-*.txt
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  publish:
    if: >-
      always() &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_from_run_id != '')
      ) &&
      (
        needs.build-desktop.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_from_run_id != '' && needs.build-desktop.result == 'skipped')
      ) &&
      (
        needs.build-macos.result == 'success' ||
        needs.build-macos.result == 'skipped' ||
        needs.build-macos.result == 'cancelled'
      )
    needs: [build-desktop, build-macos]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Decide whether the macOS package may be absent
        id: macos
        shell: bash
        run: |
          # 'success' means the DMG and updater archive exist, so the manifest
          # must contain them. Anything else means the runner never produced
          # them, and macOS installs simply keep their current version until the
          # next run that does have one.
          if [ "${{ needs.build-macos.result }}" = "success" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--allow-missing-platform macos" >> "$GITHUB_OUTPUT"
            echo "::warning::No macOS build was published in this run (job result: ${{ needs.build-macos.result }}); macOS installs will not be offered this update."
          fi

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
          run-id: ${{ inputs.publish_from_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create signed updater manifest
        run: >
          python scripts/create_updater_manifest.py
          --tag "${{ inputs.release_tag || github.ref_name }}"
          --repository "${{ github.repository }}"
          --artifacts release-assets
          --output release-assets/latest.json
          ${{ steps.macos.outputs.flag }}

      - name: Prepare release installer and updater assets
        shell: bash
        run: |
          mkdir -p release-publish
          cp release-assets/latest.json release-publish/latest.json
          while IFS= read -r -d '' asset; do
            cp "$asset" release-publish/
          done < <(find release-assets -type f \( \
            -name '*-setup.exe' -o \
            -name '*.AppImage' -o \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' \
          \) -print0)
          installer="$(find release-publish -type f -name '*-setup.exe' -print -quit)"
          test -n "$installer"
          cp "$installer" release-publish/IDLR-App-Setup.exe

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: release-publish/*

      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          release_id="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id)"
          while IFS=$'\t' read -r asset_id asset_name; do
            keep_asset=false
            for file in release-publish/*; do
              expected_name="${file##*/}"
              expected_name="${expected_name// /.}"
              if [[ "$expected_name" == "$asset_name" ]]; then
                keep_asset=true
                break
              fi
            done
            if [[ "$keep_asset" == false ]]; then
              gh api --method DELETE "repos/$REPOSITORY/releases/assets/$asset_id"
            fi
          done < <(gh api --paginate "repos/$REPOSITORY/releases/$release_id/assets" --jq '.[] | [.id, .name] | @tsv')
